  <script type="text/javascript">
    $(function () {
      var FPS = 50;
      var CANVAS_ID = 'canvas';
      var ctx = createCanvasContext();
      ctx.font = "16px prstart"
      var eventManager = new EventManager();
      var keyboard = new Keyboard(eventManager);
      var sceneManager = new SceneManager(eventManager);
      sceneManager.toLoadingScene();
      setInterval(gameLoop, 1000 / FPS);
      function gameLoop() {
        keyboard.fireEvents();
        sceneManager.update();
        sceneManager.draw(ctx);
      }
      function createCanvasContext() {
        $('<canvas id="' + CANVAS_ID + '" width="' + Globals.CANVAS_WIDTH + '" height="' + Globals.CANVAS_HEIGHT + '"></canvas>').prependTo('#main');
        var canvas = document.getElementById(CANVAS_ID);
        return canvas.getContext('2d');
      };
    });
  </script>

  <style>
    /* Hace que el juego se encoja si la pantalla es chica */

      margin: 0 auto; /* Centrarlo */
    }
    #main {

      overflow: hidden; /* Evita que se salga */

<style>
    /* CONTENEDOR PRINCIPAL */
    #mobile-controls {
      display: none; 
      position: fixed;
      bottom: 20px; /* Un poco más abajo */
      left: 0;
      width: 100%;
      height: 220px; 
      z-index: 9999;
      pointer-events: none;
      font-family: sans-serif;
    }

    @media (max-width: 1024px) {
      #mobile-controls { display: flex; }
      #help { display: none !important; } 
    }

    .control-group {
      flex: 1;
      position: relative;
      pointer-events: auto;
    }

    /* ESTILO DE LOS BOTONES (TAMAÑO REDUCIDO A 65px) */
    .btn-touch {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      position: absolute;
      
      /* TAMAÑO NUEVO: 65px (20% menos que los 80px anteriores) */
      width: 65px; 
      height: 65px; 
      
      display: flex;
      justify-content: center;
      align-items: center;
      
      font-size: 28px; 
      
      color: white;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    }
    
    .btn-touch:active { 
      background: rgba(255, 255, 255, 0.6); 
      transform: scale(0.95);
    }

    /* === POSICIONES === */
    
    /* CRUCETA IZQUIERDA */
    #btn-up    { top: 10px;     left: 80px; }
    #btn-down  { bottom: 25px;  left: 80px; }
    #btn-left  { top: 80px;     left: 10px; }
    #btn-right { top: 80px;     left: 150px; }

    /* BOTONES DERECHA */
    #btn-fire  { 
      bottom: 40px; right: 20px; 
      background: rgba(255, 50, 50, 0.4); 
      width: 75px; height: 75px; font-size: 32px; 
    }
    
    #btn-start { 
      top: 20px; right: 20px; 
      background: rgba(50, 255, 50, 0.4); 
      width: 90px; height: 40px; 
      border-radius: 10px; font-size: 14px; font-weight: bold;
    }
</style>

<div id="mobile-controls">
    <div class="control-group">
      <div id="btn-up" class="btn-touch">⬆️</div>
      <div id="btn-left" class="btn-touch">⬅️</div>
      <div id="btn-right" class="btn-touch">➡️</div>
      <div id="btn-down" class="btn-touch">⬇️</div>
    </div>
    
    <div class="control-group">
      <div id="btn-start" class="btn-touch">START</div>
      <div id="btn-fire" class="btn-touch">🔥</div>
    </div>
</div>

<script>
    function simulateKey(keyCode, type) {
      var evt = document.createEvent("Events");
      evt.initEvent(type, true, true);
      evt.keyCode = keyCode;
      evt.which = keyCode;
      document.dispatchEvent(evt);
      window.dispatchEvent(evt);
    }

    var buttons = [
      { id: 'btn-up', code: 38 },
      { id: 'btn-down', code: 40 },
      { id: 'btn-left', code: 37 },
      { id: 'btn-right', code: 39 },
      { id: 'btn-fire', code: 32 },
      { id: 'btn-start', code: 13 }
    ];

    buttons.forEach(function(btn) {
      var element = document.getElementById(btn.id);
      element.addEventListener('touchstart', function(e) {
        e.preventDefault();
        simulateKey(btn.code, 'keydown');
        element.style.backgroundColor = "rgba(255, 255, 255, 0.8)";
      }, false);

      element.addEventListener('touchend', function(e) {
        e.preventDefault();
        simulateKey(btn.code, 'keyup');
        element.style.backgroundColor = "";
      }, false);
    });
</script>
